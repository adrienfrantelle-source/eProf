project_id = "eprof"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://eprof.vercel.app"]
jwt_expiry = 3600
# L'inscription est ouverte côté GoTrue, mais restreinte en pratique par le
# trigger handle_new_user() : seul un identifiant présent dans la table
# allowed_teachers (et pas déjà utilisé) peut créer un compte.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false


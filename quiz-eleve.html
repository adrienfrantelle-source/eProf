<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - eProf</title>
    <link rel="icon" type="image/jpeg" href="images/logo eProf.jpg">
    <link rel="stylesheet" href="css/theme-variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz-eleve.css">
</head>
<body>
    <header>
        <div class="header-logo-title">
            <a href="index.html" title="Retour à l'accueil">
                <img src="images/logo eProf.jpg" alt="Logo eProf" class="logo-eprof">
            </a>
            <h1>Quiz Interactif</h1>
        </div>
    </header>

    <main class="quiz-eleve-container">
        <div id="quiz-intro" class="quiz-section active">
            <div class="intro-card">
                <div class="intro-icon">📝</div>
                <h2 id="quiz-title-intro">Chargement du quiz...</h2>
                <p id="quiz-description">Préparez-vous à répondre aux questions</p>
                <div class="quiz-meta">
                    <span class="meta-item" id="quiz-questions-count">-</span>
                    <span class="meta-item" id="quiz-niveau">-</span>
                </div>
                
                <div class="student-info">
                    <h3>Vos informations</h3>
                    <input type="text" id="student-name" placeholder="Votre nom et prénom" class="form-input">
                    <input type="text" id="student-classe" placeholder="Votre classe (optionnel)" class="form-input">
                </div>
                
                <button class="btn-start-quiz" onclick="startQuiz()">🚀 Commencer le quiz</button>
            </div>
        </div>

        <div id="quiz-questions" class="quiz-section">
            <div class="quiz-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
                <p class="progress-text">
                    Question <span id="current-question">1</span> sur <span id="total-questions">10</span>
                </p>
            </div>

            <div id="question-container" class="question-display">
                <!-- Les questions seront insérées ici dynamiquement -->
            </div>

            <div class="navigation-buttons">
                <button class="btn-nav" id="btn-prev" onclick="previousQuestion()" disabled>← Précédent</button>
                <button class="btn-nav btn-next" id="btn-next" onclick="nextQuestion()">Suivant →</button>
            </div>
        </div>

        <div id="quiz-results" class="quiz-section">
            <div class="results-card">
                <div class="results-icon">🎉</div>
                <h2>Quiz terminé !</h2>
                <p>Merci d'avoir participé</p>
                
                <div class="score-display">
                    <div class="score-circle">
                        <span class="score-value" id="final-score">-</span>
                        <span class="score-label">/ <span id="total-score">-</span></span>
                    </div>
                    <p class="score-percentage" id="score-percentage">-</p>
                </div>

                <div id="answers-summary" class="answers-summary">
                    <!-- Résumé des réponses -->
                </div>

                <div class="results-buttons">
                    <button class="btn-action" onclick="reviewAnswers()">📋 Revoir mes réponses</button>
                    <button class="btn-action" onclick="location.reload()">🔄 Refaire le quiz</button>
                </div>

                <p class="submission-info" id="submission-info"></p>
            </div>
        </div>

        <div id="quiz-error" class="quiz-section">
            <div class="error-card">
                <div class="error-icon">⚠️</div>
                <h2>Quiz introuvable</h2>
                <p>Le quiz que vous recherchez n'existe pas ou a expiré.</p>
                <a href="index.html" class="btn-action">Retour à l'accueil</a>
            </div>
        </div>
    </main>

    <script src="js/quiz-eleve.js"></script>
</body>
</html>
